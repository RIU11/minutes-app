<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="録音から、文字起こし・話者の分け・要約・質問の提案まで。部外秘は端末の中だけで処理する議事録アプリ。">
<meta name="theme-color" content="#1d5b8f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/app.css">

<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="ホームへ">
    <img src="icons/favicon-64.png" alt="" width="28" height="28">
    <span>議事録</span>
  </a>
  <div class="topbar-right" id="topbar-right"></div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="メニュー">
  <a href="#/" data-tab="home"><span class="ti" data-icon="home"></span><span>一覧</span></a>
